    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'light' || savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', savedTheme);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <style>
      #global-loader {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        inset: 0;
        background-color: #0a0a0a;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        -webkit-transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .loader-logo { 
        width: 140px; 
        height: auto;
        margin-bottom: 40px; 
        animation: pulse 2.5s infinite ease-in-out;
        -webkit-animation: pulse 2.5s infinite ease-in-out;
      }
      .loader-bar-container { 
        width: 220px; 
        height: 2px; 
        background: rgba(255,255,255,0.05); 
        overflow: hidden; 
        border-radius: 2px; 
      }
      .loader-bar { 
        width: 0%; 
        height: 100%; 
        background: #C5A880; 
        animation: loadAnim 1.5s ease-out forwards; 
        -webkit-animation: loadAnim 1.5s ease-out forwards;
      }
      @keyframes loadAnim { 0% { width: 0%; opacity: 0.5; } 100% { width: 100%; opacity: 1; } }
      @-webkit-keyframes loadAnim { 0% { width: 0%; opacity: 0.5; } 100% { width: 100%; opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.02); } }
      @-webkit-keyframes pulse { 0%, 100% { opacity: 0.85; -webkit-transform: scale(1); transform: scale(1); } 50% { opacity: 1; -webkit-transform: scale(1.02); transform: scale(1.02); } }
      #global-loader.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Loading Screen (Vanilla, Zero Overhead) -->
    <div id="global-loader" aria-hidden="false" role="alert" aria-live="assertive" aria-busy="true">
      <img src="/assets/branding/logo/logo-barreto.png" alt="Barreto Advocacia - Carregando..." class="loader-logo" loading="eager" width="140" height="32" />
      <div class="loader-bar-container"><div class="loader-bar"></div></div>
    </div>

    <!-- React Root -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function() {
        // Função de desarme compatível com Safari (incluindo bfcache e carregamento assíncrono)
        function dismissLoader() {
          var loader = document.getElementById('global-loader');
          if (loader && !loader.classList.contains('fade-out')) {
            loader.classList.add('fade-out');
            loader.setAttribute('aria-hidden', 'true');
            loader.setAttribute('aria-busy', 'false');
            setTimeout(function() {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 650);
          }
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          setTimeout(dismissLoader, 500);
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(dismissLoader, 600);
          });
          window.addEventListener('load', function() {
            setTimeout(dismissLoader, 500);
          });
        }

        window.addEventListener('pageshow', function() {
          dismissLoader();
        });

        // Safety Timeout (Fallback máximo)
        setTimeout(dismissLoader, 3000);
      })();
    </script>
  </body>
